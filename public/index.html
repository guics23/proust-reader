<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16150f" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Proust Reader</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="home" hidden>
    <header class="home-head">
      <h1>Proust Reader</h1>
      <p class="sub">Lecture bilingue, phrase par phrase</p>
    </header>
    <ol id="shelf" class="shelf"></ol>
  </div>

  <main id="reader" aria-live="polite">
    <div id="page">
      <section class="half" id="top"><div class="text"></div></section>
      <hr class="divider">
      <section class="half" id="bottom"><div class="text"></div></section>
    </div>
  </main>

  <footer id="bar">
    <button id="menu-btn" class="icon" aria-label="Chapitres">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div id="ticks"></div>
      <div id="fill"></div>
    </div>
    <button id="mark-btn" class="icon" aria-label="Marque-page" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg>
    </button>
  </footer>

  <div id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Navigation">
      <header class="sheet-head">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="chapters" aria-selected="true">Chapitres</button>
          <button role="tab" data-tab="marks">Marque-pages</button>
          <button role="tab" data-tab="books">Livres</button>
        </nav>
        <button class="icon" id="sheet-close" aria-label="Fermer">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="sheet-body">
        <ol id="tab-chapters" class="list"></ol>
        <ol id="tab-marks" class="list" hidden></ol>
        <ol id="tab-books" class="list" hidden></ol>
      </div>
      <footer class="sheet-foot">
        <button id="font-down" aria-label="Texte plus petit">A−</button>
        <button id="font-up" aria-label="Texte plus grand">A+</button>
        <button id="theme-btn">Thème : auto</button>
      </footer>
    </div>
  </div>

  <div id="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
