[project]
name = "proust-reader"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "pysbd>=0.3.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
